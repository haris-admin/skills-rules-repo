name: Validate Skills and Rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Validate structure and catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Run structure/frontmatter validation
        run: python3 scripts/validate.py

      - name: Check README catalog is up to date (PRs)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/generate_catalog.py --check || {
            echo "::error::README catalog is out of date — run \`python3 scripts/generate_catalog.py\` and commit the result.";
            exit 1;
          }

      - name: Auto-regenerate README catalog on main if stale
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! python3 scripts/generate_catalog.py --check; then
            python3 scripts/generate_catalog.py
            if ! git diff --quiet README.md; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add README.md
              git commit -m "fix(catalog): auto-regenerate README catalog [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
          python3 scripts/generate_catalog.py --check
