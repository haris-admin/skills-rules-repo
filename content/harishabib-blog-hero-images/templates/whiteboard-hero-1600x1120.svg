<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">REPLACE: figure title</title>
  <desc id="desc">REPLACE: one or two sentences describing the figure for screen readers.</desc>
  <defs>
    <style>
      .title { font: 800 54px sans-serif; fill: #1e293b; }
      .subtitle { font: 400 26px sans-serif; fill: #475569; }
      .sectionHeading { font: 700 24px sans-serif; fill: #1d4ed8; }
      .bullet { font: 400 21px sans-serif; fill: #334155; }
      .num { font: 700 26px sans-serif; fill: #fff; }
      .tag { font: 600 20px sans-serif; fill: #1d4ed8; }
      .foot { font: 400 19px sans-serif; fill: #64748b; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- canvas + inner card + corner brackets -->
  <rect width="1600" height="1120" fill="#f6f2e8"/>
  <g filter="url(#shadow)">
    <rect x="24" y="24" width="1552" height="1072" rx="26" fill="#fbfaf7" stroke="#d7d2c7" stroke-width="4"/>
  </g>
  <path d="M72 72 h44 M72 72 v44 M1484 72 h44 M1528 72 v44 M72 1048 h44 M72 1004 v44 M1484 1048 h44 M1528 1004 v44" fill="none" stroke="#2d2d2d" stroke-width="6" stroke-linecap="round"/>

  <!-- title + rule + subtitle -->
  <text x="800" y="112" text-anchor="middle" class="title">REPLACE: HOOK LINE IN CAPITALS</text>
  <line x1="300" y1="140" x2="1300" y2="140" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <text x="800" y="182" text-anchor="middle" class="subtitle"><tspan x="800" y="178">REPLACE: context line one</tspan><tspan x="800" y="210" class="subtitle">REPLACE: context line two</tspan></text>

