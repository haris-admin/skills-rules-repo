    <text x="120" y="294" text-anchor="middle" class="num">1</text>
    <text x="152" y="292" class="sectionHeading">REPLACE HEADING</text>
    <rect x="106" y="322" width="12" height="12" rx="2" fill="rgba(4,120,87,0.08)" stroke="#047857" stroke-width="2"/>
    <text x="128" y="334" class="bullet">REPLACE bullet one</text>
    <rect x="106" y="350" width="12" height="12" rx="2" fill="rgba(4,120,87,0.08)" stroke="#047857" stroke-width="2"/>
    <text x="128" y="362" class="bullet">REPLACE bullet two</text>
    <rect x="106" y="378" width="12" height="12" rx="2" fill="rgba(4,120,87,0.08)" stroke="#047857" stroke-width="2"/>
    <text x="128" y="390" class="bullet">REPLACE bullet three</text>
  </g>

  <!-- card 2 (top-right) -->
  <g>
    <rect x="820" y="248" width="700" height="190" rx="18" fill="rgba(255,255,255,0.74)" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="860" cy="286" r="22" fill="#1d4ed8"/>
