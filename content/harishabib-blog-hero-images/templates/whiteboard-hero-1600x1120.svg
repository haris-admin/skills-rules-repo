    <rect x="80" y="460" width="700" height="190" rx="18" fill="rgba(255,255,255,0.74)" stroke="#047857" stroke-width="3"/>
    <circle cx="120" cy="498" r="22" fill="#047857"/>
    <text x="120" y="506" text-anchor="middle" class="num">3</text>
    <text x="152" y="504" class="sectionHeading" fill="#047857">REPLACE HEADING</text>
    <rect x="106" y="534" width="12" height="12" rx="2" fill="rgba(4,120,87,0.08)" stroke="#047857" stroke-width="2"/>
    <text x="128" y="546" class="bullet">REPLACE bullet one</text>
    <rect x="106" y="562" width="12" height="12" rx="2" fill="rgba(4,120,87,0.08)" stroke="#047857" stroke-width="2"/>
    <text x="128" y="574" class="bullet">REPLACE bullet two</text>
    <rect x="106" y="590" width="12" height="12" rx="2" fill="rgba(4,120,87,0.08)" stroke="#047857" stroke-width="2"/>
    <text x="128" y="602" class="bullet">REPLACE bullet three</text>
  </g>

  <!-- card 4 (bottom-right) -->
  <g>
    <rect x="820" y="460" width="700" height="190" rx="18" fill="rgba(255,255,255,0.74)" stroke="#047857" stroke-width="3"/>
    <circle cx="860" cy="498" r="22" fill="#047857"/>
    <text x="860" y="506" text-anchor="middle" class="num">4</text>
    <text x="892" y="504" class="sectionHeading" fill="#047857">REPLACE HEADING</text>
    <rect x="846" y="534" width="12" height="12" rx="2" fill="rgba(4,120,87,0.08)" stroke="#047857" stroke-width="2"/>
    <text x="868" y="546" class="bullet">REPLACE bullet one</text>
    <rect x="846" y="562" width="12" height="12" rx="2" fill="rgba(4,120,87,0.08)" stroke="#047857" stroke-width="2"/>
    <text x="868" y="574" class="bullet">REPLACE bullet two</text>
    <rect x="846" y="590" width="12" height="12" rx="2" fill="rgba(4,120,87,0.08)" stroke="#047857" stroke-width="2"/>
    <text x="868" y="602" class="bullet">REPLACE bullet three</text>
  </g>

  <!-- wide amber card: keep body text under ~130 chars per line, or split into two tspans -->
  <g>
    <rect x="80" y="672" width="1440" height="124" rx="18" fill="rgba(255,255,255,0.74)" stroke="#b45309" stroke-width="3"/>
    <circle cx="120" cy="712" r="22" fill="#b45309"/>
    <text x="120" y="720" text-anchor="middle" class="num">5</text>
    <text x="152" y="710" class="sectionHeading" fill="#b45309">REPLACE TAKEAWAY HEADING</text>
    <text x="152" y="748" class="bullet"><tspan x="152" y="748">REPLACE takeaway line one —</tspan><tspan x="152" y="780">REPLACE takeaway line two.</tspan></text>
  </g>

  <!-- closing tag line + divider + footnotes + attribution -->
  <text x="800" y="852" text-anchor="middle" class="tag">REPLACE THE ONE-LINE CLOSING ARGUMENT</text>
  <line x1="300" y1="874" x2="1300" y2="874" stroke="#d7d2c7" stroke-width="3"/>
  <text x="120" y="912" class="foot">REPLACE footnote one</text>
  <text x="120" y="944" class="foot">REPLACE footnote two</text>
  <text x="120" y="976" class="foot">Sources: REPLACE</text>
  <text x="1480" y="1040" text-anchor="end" class="foot" fill="#94a3b8">harishabib.au · REPLACE section</text>
